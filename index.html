<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【士縁会 定例セミナー】遺言の重要性と民法改正後の最新事情</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #e53e3e;
            --accent-hover: #c53030;
            --bg-light: #f7fafc;
            --text-main: #2d3748;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-light);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            min-height: 100vh;
        }

        /* ヒーローヘッダー */
        .hero {
            background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
            color: #ffffff;
            padding: 50px 20px;
            text-align: center;
            position: relative;
        }

        .hero-badge {
            display: inline-block;
            background: #ecc94b;
            color: #744210;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 2.1rem;
            line-height: 1.3;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .hero-date {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        /* メインコンテンツエリア */
        main {
            padding: 40px 25px;
        }

        section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: var(--secondary-color);
            margin-right: 12px;
            border-radius: 2px;
        }

        /* CTAボタン */
        .cta-container {
            text-align: center;
            margin: 35px 0;
        }

        .btn-cta {
            display: inline-block;
            background: linear-gradient(180deg, #f56565 0%, #e53e3e 100%);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            padding: 16px 50px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(229, 62, 62, 0.4);
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 62, 62, 0.6);
            background: linear-gradient(180deg, #e53e3e 0%, #c53030 100%);
        }

        /* 概要テーブル */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .info-table th, .info-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-table th {
            background-color: #edf2f7;
            color: var(--primary-color);
            width: 25%;
            text-align: left;
            font-weight: bold;
            white-space: nowrap;
        }

        .info-table tr:last-child th,
        .info-table tr:last-child td {
            border-bottom: none;
        }

        /* タイムスケジュール */
        .timeline {
            position: relative;
            padding-left: 20px;
            border-left: 3px solid var(--secondary-color);
            margin-left: 10px;
        }

        .timeline-item {
            margin-bottom: 25px;
            position: relative;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -28px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--secondary-color);
            border: 3px solid #ffffff;
        }

        .timeline-time {
            font-weight: bold;
            color: var(--secondary-color);
            font-size: 1.05rem;
        }

        .timeline-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 2px;
        }

        .timeline-desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* 講師プロフィール（画像対応） */
        .profile-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .profile-img-wrap {
            width: 180px;
            flex-shrink: 0;
        }

        .profile-img-wrap img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .profile-content {
            flex-grow: 1;
        }

        .profile-name-title {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .profile-sub {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .profile-body ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        .profile-body li {
            margin-bottom: 6px;
        }

        /* 講演内容カード */
        .program-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .program-card h3 {
            font-size: 1.15rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .program-card h3 span {
            background: var(--secondary-color);
            color: #fff;
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 10px;
        }

        .program-card ul {
            padding-left: 20px;
            color: var(--text-sub);
        }

        .program-card li {
            margin-bottom: 6px;
        }

        /* 懇親会セクション（別会場） */
        .party-box {
            background: #fffaf0;
            border: 2px dashed #dd6b20;
            border-radius: 10px;
            padding: 20px;
        }

        .party-box h3 {
            color: #c05621;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: var(--primary-color);
            color: #ffffff;
            font-size: 0.85rem;
        }

        @media (max-width: 650px) {
            .hero h1 { font-size: 1.6rem; }
            .info-table th, .info-table td { display: block; width: 100%; }
            .info-table th { background: #edf2f7; }
            .profile-card { flex-direction: column; align
