<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【相続診断士会 定例セミナー】遺言の重要性と遺言最新事情</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #e53e3e;
            --accent-hover: #c53030;
            --bg-light: #f7fafc;
            --text-main: #2d3748;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-light);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            min-height: 100vh;
        }

        /* ヒーローヘッダー */
        .hero {
            background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
            color: #ffffff;
            padding: 50px 20px;
            text-align: center;
            position: relative;
        }

        .hero-badge {
            display: inline-block;
            background: #ecc94b;
            color: #744210;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 2.2rem;
            line-height: 1.3;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .hero-date {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        /* メインコンテンツエリア */
        main {
            padding: 40px 25px;
        }

        section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: var(--secondary-color);
            margin-right: 12px;
            border-radius: 2px;
        }

        /* CTAボタン */
        .cta-container {
            text-align: center;
            margin: 35px 0;
        }

        .btn-cta {
            display: inline-block;
            background: linear-gradient(180deg, #f56565 0%, #e53e3e 100%);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            padding: 16px 50px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(229, 62, 62, 0.4);
            transition: all 0.3s ease;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 62, 62, 0.6);
            background: linear-gradient(180deg, #e53e3e 0%, #c53030 100%);
        }

        /* 概要テーブル */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .info-table th, .info-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-table th {
            background-color: #edf2f7;
            color: var(--primary-color);
            width: 25%;
            text-align: left;
            font-weight: bold;
            white-space: nowrap;
        }

        .info-table tr:last-child th,
        .info-table tr:last-child td {
            border-bottom: none;
        }
